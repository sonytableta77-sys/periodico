    <!-- Google Analytics & Indexación Multi-Dominio (esteponabarbers.com & esteponarestaurants.com) -->
    <script>
      (function() {
        var hostname = window.location.hostname;
        var analyticsId = null;
        var canonicalDomain = null;

        // Configuración por dominio
        if (hostname.indexOf('esteponabarbers.com') !== -1) {
          analyticsId = '529027322';
          canonicalDomain = 'https://esteponabarbers.com';
        } else if (hostname.indexOf('esteponarestaurants.com') !== -1) {
          analyticsId = '527696324';
          canonicalDomain = 'https://esteponarestaurants.com';
        }

        // 1. Etiqueta Canonical Dinámica para evitar penalización de Google por contenido duplicado
        var canonicalHref = canonicalDomain 
          ? canonicalDomain + (window.location.pathname === '/' ? '' : window.location.pathname)
          : window.location.origin + window.location.pathname;

        var existingCanonical = document.querySelector('link[rel="canonical"]');
        if (!existingCanonical) {
          var link = document.createElement('link');
          link.setAttribute('rel', 'canonical');
          link.setAttribute('href', canonicalHref);
          document.head.appendChild(link);
        } else {
          existingCanonical.setAttribute('href', canonicalHref);
        }

        // 2. Google Analytics 4 (gtag.js) optimizado
        if (analyticsId) {
          var tagId = (analyticsId.indexOf('G-') === 0 || analyticsId.indexOf('GT-') === 0) 
            ? analyticsId 
            : ('G-' + analyticsId);

          window.dataLayer = window.dataLayer || [];
          function gtag(){ window.dataLayer.push(arguments); }
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', tagId, {
            send_page_view: true,
            anonymize_ip: true,
            cookie_domain: 'auto'
          });

          var gaScript = document.createElement('script');
          gaScript.async = true;
          gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + tagId;
          document.head.appendChild(gaScript);
        }
      })();
    </script>
