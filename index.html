    <!-- Google Analytics & Indexación Multi-Dominio (esteponabarbers.com & esteponarestaurants.com) -->
    <script>
      (function() {
        var hostname = window.location.hostname;
        var analyticsId = null;
        var canonicalDomain = null;

        // Configuración por dominio
        if (hostname.indexOf('esteponabarbers.com') !== -1) {
          analyticsId = '529027322';
          canonicalDomain = 'https://esteponabarbers.com';
        } else if (hostname.indexOf('esteponarestaurants.com') !== -1) {
          analyticsId = '527696324';
          canonicalDomain = 'https://esteponarestaurants.com';
        }

        // 1. Etiqueta Canonical Dinámica para evitar penalización de Google por contenido duplicado
        var canonicalHref = canonicalDomain 
          ? canonicalDomain + (window.location.pathname === '/' ? '' : window.location.pathname)
          : window.location.origin + window.location.pathname;

        var existingCanonical = document.querySelector('link[rel="canonical"]');
        if (!existingCanonical) {
          var link = document.createElement('link');
          link.setAttribute('rel', 'canonical');
          link.setAttribute('href', canonicalHref);
          document.head.appendChild(link);
        } else {
          existingCanonical.setAttribute('href', canonicalHref);
        }

        // 2. Google Analytics 4 (gtag.js) optimizado
        if (analyticsId) {
          var tagId = (analyticsId.indexOf('G-') === 0 || analyticsId.indexOf('GT-') === 0) 
            ? analyticsId 
            : ('G-' + analyticsId);

          window.dataLayer = window.dataLayer || [];
          function gtag(){ window.dataLayer.push(arguments); }
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', tagId, {
            send_page_view: true,
            anonymize_ip: true,
            cookie_domain: 'auto'
          });

          var gaScript = document.createElement('script');
          gaScript.async = true;
          gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + tagId;
          document.head.appendChild(gaScript);
        }
      })();
    </script>

  <body class="bg-[#241f1a] text-[#2c241c] antialiased selection:bg-[#c9b28b] selection:text-[#1a140e] min-h-screen">
    <!-- Global SVG Filter for Authentic Worn Typewriter Ink Displacement & Imperfections -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
      <defs>
        <!-- Standard Worn Ink -->
        <filter id="worn-ink-filter" x="-5%" y="-5%" width="110%" height="110%" filterUnits="objectBoundingBox">
          <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.4" xChannelSelector="R" yChannelSelector="G" result="displaced" />
          <feGaussianBlur in="displaced" stdDeviation="0.2" result="blurred" />
          <feMerge>
            <feMergeNode in="displaced" />
            <feMergeNode in="blurred" opacity="0.6" />
          </feMerge>
        </filter>

        <!-- Heavy Worn Ink (Faded Ribbon) -->
        <filter id="heavy-worn-ink-filter" x="-5%" y="-5%" width="110%" height="110%" filterUnits="objectBoundingBox">
          <feTurbulence type="fractalNoise" baseFrequency="0.065" numOctaves="4" result="heavyNoise" />
          <feDisplacementMap in="SourceGraphic" in2="heavyNoise" scale="2.2" xChannelSelector="R" yChannelSelector="B" result="heavyDisplaced" />
          <feGaussianBlur in="heavyDisplaced" stdDeviation="0.35" result="heavyBlurred" />
          <feMerge>
            <feMergeNode in="heavyDisplaced" />
            <feMergeNode in="heavyBlurred" opacity="0.4" />
          </feMerge>
        </filter>
      </defs>
    </svg>

    <div id="root"></div>

    <!-- Script universal:
         - En AI Studio / entorno de desarrollo (puerto 3000 o cloud run): ejecuta /src/main.tsx
         - En Hostinger / servidor web estático (sin compilar): ejecuta ./assets/index.js ya precompilado -->
    <script type="module">
      const isDev = location.port === '3000' || location.hostname.includes('run.app');
      if (isDev) {
        import('/src/main.tsx');
      } else {
        const s = document.createElement('script');
        s.type = 'module';
        s.src = './assets/index.js?v=' + Date.now();
        document.body.appendChild(s);
      }
    </script>
    <script type="module" src="/src/main.tsx" style="display:none"></script>
